<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario de Reservas</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  text-align:center;
}

h2{ margin:10px 0 }

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  max-width:420px;
  margin:auto;
}

.day{
  background:white;
  border-radius:8px;
  padding:10px;
  cursor:pointer;
  border:1px solid #ccc;
}

.day:hover{ background:#e6f0ff }

.pending{ background:#fff3cd }
.approved{
  background:#d4edda;
  font-size:22px;
}
.disabled{
  background:#dcdcdc;
  color:#777;
  cursor:not-allowed;
}

button{
  margin:3px;
  padding:6px 10px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}

.ok{ background:#4caf50; color:white }
.no{ background:#f44336; color:white }

.mensaje{
  margin:10px;
  padding:10px;
  background:#ffe0e0;
  color:#b30000;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<h2>📅 Reservas de la Tía</h2>

<div id="calendar"></div>
<div id="msg" class="mensaje"></div>

<h3>👩‍🦰 Panel de la Tía</h3>
<div id="panel"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "reservas-tia.firebaseapp.com",
  databaseURL: "https://reservas-tia-default-rtdb.firebaseio.com",
  projectId: "reservas-tia",
  storageBucket: "reservas-tia.appspot.com",
  messagingSenderId: "1075374491628",
  appId: "1:1075374491628:web:39589fdde043aeff9ca2c9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const emojis = {
  "Luz":"💋",
  "Juan":"🧢",
  "Sofi":"🌸"
};

let sobrino = prompt("¿Quién sos? (Luz / Juan / Sofi)");
if(!emojis[sobrino]) sobrino="Luz";

const cal = document.getElementById("calendar");
const panel = document.getElementById("panel");
const msg = document.getElementById("msg");

function aviso(texto){
  msg.innerText = texto;
  msg.style.display="block";
  setTimeout(()=>msg.style.display="none",3000);
}

const hoy = new Date();
const year = hoy.getFullYear();
const month = hoy.getMonth();

function render(reservas){
  cal.innerHTML="";
  panel.innerHTML="";

  const primer = new Date(year,month,1).getDay();
  const total = new Date(year,month+1,0).getDate();

  for(let i=0;i<primer;i++) cal.innerHTML+="<div></div>";

  for(let d=1;d<=total;d++){
    const r = reservas[d];
    let clase="day";
    let contenido=d;

    if(r){
      if(r.estado==="disabled"){
        clase="day disabled";
        contenido="🚫";
      }
      if(r.estado==="pending"){
        clase="day pending";
        contenido=d+"<br>"+r.sobrino;
      }
      if(r.estado==="approved"){
        clase="day approved";
        contenido=emojis[r.sobrino];
      }
    }

    cal.innerHTML+=`<div class="${clase}" onclick="clickDia(${d})">${contenido}</div>`;
  }

  Object.keys(reservas).forEach(d=>{
    const r=reservas[d];
    if(r.estado==="pending"){
      panel.innerHTML+=`
      Día ${d} - ${r.sobrino}
      <button class="ok" onclick="aprobar(${d})">Aceptar</button>
      <button class="no" onclick="rechazar(${d})">Rechazar</button><br>`;
    }
  });
}

window.clickDia = dia =>{
  onValue(ref(db,"reservas"), snap=>{
    const all=snap.val()||{};
    const mias=Object.values(all).filter(x=>x.sobrino===sobrino);
    if(mias.length>=1){
      aviso("⚠️ Ya hiciste una reserva");
      return;
    }

    if(!all[dia]){
      set(ref(db,"reservas/"+dia),{
        sobrino,
        estado:"pending"
      });
    }
  },{once:true});
}

window.aprobar = dia => update(ref(db,"reservas/"+dia),{estado:"approved"});
window.rechazar = dia => remove(ref(db,"reservas/"+dia));

onValue(ref(db,"reservas"), snap=>{
  render(snap.val()||{});
});
</script>

</body>
</html>
