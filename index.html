<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reservas de la Tía</title>

<style>
body{
  font-family: Arial;
  background:#f2f2f2;
  padding:20px;
  text-align:center;
}

h1{ margin-bottom:10px }

select, button{
  padding:8px;
  font-size:16px;
  margin:5px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  max-width:420px;
  margin:auto;
}

.weekday{
  background:#74b9ff;
  color:white;
  padding:8px;
  border-radius:6px;
  font-weight:bold;
}

.day{
  background:white;
  padding:12px;
  border-radius:6px;
  cursor:pointer;
  border:1px solid #ccc;
}

.day.pending{ background:#ffeaa7 }
.day.approved{ background:#55efc4; font-size:22px }
.day.disabled{
  background:#ccc;
  color:#666;
  cursor:not-allowed;
}

#panelTia{
  background:white;
  padding:15px;
  margin-top:25px;
  border-radius:8px;
  display:none;
}

#mensaje{
  display:none;
  background:#ffeaa7;
  color:#6b4f00;
  padding:10px;
  border-radius:8px;
  margin:10px auto;
  max-width:420px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>Reservas de la Tía</h1>

<select id="sobrino">
  <option value="">Elegí tu nombre</option>
  <option value="Luz">Luz 💋</option>
  <option value="Vicky">Vicky 😜</option>
  <option value="Agus">Agus 😈</option>
  <option value="Dante">Dante 🐴</option>
  <option value="Pili">Pili 🥳</option>
</select>

<div id="mensaje"></div>

<div class="calendar" id="calendar"></div>

<br>
<button onclick="loginTia()">Panel secreto de la tía 😎</button>

<div id="panelTia">
  <h3>Panel de la tía</h3>
  <div id="lista"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

  // 🔹 Tu configuración de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAm1-VI_kDEU0yuvVzG7FPAWMnvXzGpxYY",
    authDomain: "reservas-tia.firebaseapp.com",
    databaseURL: "https://reservas-tia-default-rtdb.firebaseio.com",
    projectId: "reservas-tia",
    storageBucket: "reservas-tia.appspot.com",
    messagingSenderId: "1075374491628",
    appId: "1:1075374491628:web:39589fdde043aeff9ca2c9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const emojis = {
    Luz:"💋",
    Vicky:"😜",
    Agus:"😈",
    Dante:"🐴",
    Pili:"🥳"
  }

  let reservas = {}
  let sobrino = ""

  document.getElementById("sobrino").onchange = e => sobrino = e.target.value

  function mostrarMensaje(txt){
    const m = document.getElementById("mensaje")
    m.innerText = txt
    m.style.display = "block"
    setTimeout(()=> m.style.display="none", 3000)
  }

  function loginTia(){
    if(prompt("Contraseña de la tía") === "tia123"){
      document.getElementById("panelTia").style.display = "block"
      renderPanel()
    }
  }

  function render(){
    const cal = document.getElementById("calendar")
    cal.innerHTML = ""

    const hoy = new Date()
    const year = hoy.getFullYear()
    const month = hoy.getMonth()
    const primerDia = new Date(year,month,1).getDay()
    const totalDias = new Date(year,month+1,0).getDate()

    ;["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].forEach(d=>{
      cal.innerHTML += `<div class="weekday">${d}</div>`
    })

    for(let i=0;i<primerDia;i++){
      cal.innerHTML += `<div></div>`
    }

    for(let d=1; d<=totalDias; d++){
      const r = reservas[d]
      let cls="day"
      let txt=d

      if(r){
        if(r.estado==="disabled"){
          cls+=" disabled"
          txt="🚫"
        }
        if(r.estado==="pending"){
          cls+=" pending"
          txt=d+"<br>"+r.sobrino
        }
        if(r.estado==="approved"){
          cls+=" approved"
          txt=emojis[r.sobrino]
        }
      }

      cal.innerHTML += `<div class="${cls}" onclick="reservar(${d})">${txt}</div>`
    }
  }

  function reservar(dia){
    if(!sobrino){
      mostrarMensaje("Elegí tu nombre primero 😊")
      return
    }

    if(reservas[dia]?.estado==="disabled"){
      mostrarMensaje("🚫 Este día no está disponible")
      return
    }

    // Borrar reserva anterior del mismo sobrino
    const diaAnterior = Object.keys(reservas).find(d=>{
      const r = reservas[d]
      return r?.sobrino===sobrino && r.estado!=="disabled"
    })
    if(diaAnterior && diaAnterior!=dia){
      remove(ref(db, 'reservas/' + diaAnterior))
      mostrarMensaje(`Cambiaste tu reserva del día ${diaAnterior} al día ${dia}`)
    }

    // Si ya está reservado por otro, no hacer nada
    if(reservas[dia]) return

    set(ref(db, 'reservas/' + dia), {sobrino, estado:"pending"})
  }

  function renderPanel(){
    const l = document.getElementById("lista")
    l.innerHTML=""
    Object.keys(reservas).forEach(d=>{
      const r=reservas[d]
      if(r.estado==="pending"){
        l.innerHTML+=`
        Día ${d} - ${r.sobrino}
        <button onclick="aprobar(${d})">✔</button>
        <button onclick="rechazar(${d})">✖</button>
        <button onclick="inhabilitar(${d})">🚫</button>
        <br>`
      }
      if(r.estado==="approved"){
        l.innerHTML+=`
        Día ${d} aprobado
        <button onclick="cancelar(${d})">Cancelar</button>
        <button onclick="inhabilitar(${d})">🚫</button>
        <br>`
      }
      if(r.estado==="disabled"){
        l.innerHTML+=`
        Día ${d} inhabilitado
        <button onclick="habilitar(${d})">Habilitar</button>
        <br>`
      }
    })
  }

  // Funciones de acción
  function aprobar(d){
    set(ref(db, 'reservas/' + d), {sobrino: reservas[d].sobrino, estado:"approved"})
    mostrarMensaje(`¡Tu reserva del día ${d} fue aprobada! ✅`)
  }

  function rechazar(d){
    remove(ref(db, 'reservas/' + d))
    mostrarMensaje(`La reserva del día ${d} fue rechazada ✖`)
  }

  function cancelar(d){
    remove(ref(db, 'reservas/' + d))
    mostrarMensaje(`Cancelaste tu reserva del día ${d}`)
  }

  function inhabilitar(d){
    set(ref(db, 'reservas/' + d), {estado:"disabled"})
    mostrarMensaje(`El día ${d} fue inhabilitado 🚫`)
  }

  function habilitar(d){
    remove(ref(db, 'reservas/' + d))
    mostrarMensaje(`El día ${d} ahora está disponible 👍`)
  }

  // 🔹 Escuchar cambios en tiempo real
  const reservasRef = ref(db, 'reservas/')
  onValue(reservasRef, (snapshot)=>{
    reservas = snapshot.val() || {}
    render()
    renderPanel()
  })

</script>
</body>
</html>
