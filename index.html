<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reservas de la Tía</title>

<style>
body{
  font-family: Arial;
  background:#f2f2f2;
  padding:20px;
  text-align:center;
}

h1{ margin-bottom:10px }

select, button{
  padding:8px;
  font-size:16px;
  margin:5px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  max-width:420px;
  margin:auto;
}

.weekday{
  background:#74b9ff;
  color:white;
  padding:8px;
  border-radius:6px;
  font-weight:bold;
}

.day{
  background:white;
  padding:12px;
  border-radius:6px;
  cursor:pointer;
  border:1px solid #ccc;
}

.day.pending{ background:#ffeaa7 }
.day.approved{ background:#55efc4; font-size:22px }
.day.disabled{
  background:#ccc;
  color:#666;
  cursor:not-allowed;
}

#panelTia{
  background:white;
  padding:15px;
  margin-top:25px;
  border-radius:8px;
  display:none;
}

#mensaje{
  display:none;
  background:#ffeaa7;
  color:#6b4f00;
  padding:10px;
  border-radius:8px;
  margin:10px auto;
  max-width:420px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>Reservas de la Tía</h1>

<select id="sobrino">
  <option value="">Elegí tu nombre</option>
  <option value="Luz">Luz 💋</option>
  <option value="Vicky">Vicky 😜</option>
  <option value="Agus">Agus 😈</option>
  <option value="Dante">Dante 🐴</option>
  <option value="Pili">Pili 🥳</option>
</select>

<div id="mensaje"></div>

<div class="calendar" id="calendar"></div>

<br>
<button onclick="loginTia()">Panel secreto de la tía 😎</button>

<div id="panelTia">
  <h3>Panel de la tía</h3>
  <div id="lista"></div>
</div>

<script>
const emojis = {
  Luz:"💋",
  Vicky:"😜",
  Agus:"😈",
  Dante:"🐴",
  Pili:"🥳"
}

let reservas = JSON.parse(localStorage.getItem("reservas")) || {}
let sobrino = ""

document.getElementById("sobrino").onchange = e => sobrino = e.target.value

function mostrarMensaje(txt){
  const m = document.getElementById("mensaje")
  m.innerText = txt
  m.style.display = "block"
  setTimeout(()=> m.style.display="none", 3000)
}

function guardar(){
  localStorage.setItem("reservas", JSON.stringify(reservas))
  render()
  renderPanel()
}

function loginTia(){
  if(prompt("Contraseña de la tía") === "tia123"){
    document.getElementById("panelTia").style.display = "block"
    renderPanel()
  }
}

function render(){
  const cal = document.getElementById("calendar")
  cal.innerHTML = ""

  const hoy = new Date()
  const year = hoy.getFullYear()
  const month = hoy.getMonth()
  const primerDia = new Date(year,month,1).getDay()
  const totalDias = new Date(year,month+1,0).getDate()

  ;["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].forEach(d=>{
    cal.innerHTML += `<div class="weekday">${d}</div>`
  })

  for(let i=0;i<primerDia;i++){
    cal.innerHTML += `<div></div>`
  }

  for(let d=1; d<=totalDias; d++){
    const r = reservas[d]
    let cls="day"
    let txt=d

    if(r){
      if(r.estado==="disabled"){
        cls+=" disabled"
        txt="🚫"
      }
      if(r.estado==="pending"){
        cls+=" pending"
        txt=d+"<br>"+r.sobrino
      }
      if(r.estado==="approved"){
        cls+=" approved"
        txt=emojis[r.sobrino]
      }
    }

    cal.innerHTML += `<div class="${cls}" onclick="reservar(${d})">${txt}</div>`
  }
}

function reservar(dia){
  if(!sobrino){
    mostrarMensaje("Elegí tu nombre primero 😊")
    return
  }

  if(reservas[dia]?.estado==="disabled"){
    mostrarMensaje("🚫 Este día no está disponible")
    return
  }

  // Si el sobrino ya tiene otra reserva, borrarla automáticamente
  const diaAnterior = Object.keys(reservas).find(d=>{
    const r = reservas[d]
    return r?.sobrino===sobrino && r.estado!=="disabled"
  })

  if(diaAnterior && diaAnterior!=dia){
    delete reservas[diaAnterior]
    mostrarMensaje(`Cambiaste tu reserva del día ${diaAnterior} al día ${dia}`)
  }

  // Si ya está reservado por otro, no hacer nada
  if(reservas[dia]) return

  reservas[dia]={sobrino, estado:"pending"}
  guardar()
}

function renderPanel(){
  const l = document.getElementById("lista")
  l.innerHTML=""

  Object.keys(reservas).forEach(d=>{
    const r=reservas[d]

    if(r.estado==="pending"){
      l.innerHTML+=`
      Día ${d} - ${r.sobrino}
      <button onclick="aprobar(${d})">✔</button>
      <button onclick="rechazar(${d})">✖</button>
      <button onclick="inhabilitar(${d})">🚫</button>
      <br>`
    }

    if(r.estado==="approved"){
      l.innerHTML+=`
      Día ${d} aprobado
      <button onclick="cancelar(${d})">Cancelar</button>
      <button onclick="inhabilitar(${d})">🚫</button>
      <br>`
    }

    if(r.estado==="disabled"){
      l.innerHTML+=`
      Día ${d} inhabilitado
      <button onclick="habilitar(${d})">Habilitar</button>
      <br>`
    }
  })
}

// Funciones de acción
function aprobar(d){
  reservas[d].estado="approved"
  guardar()
  mostrarMensaje(`¡Tu reserva del día ${d} fue aprobada! ✅`)
}

function rechazar(d){ 
  delete reservas[d]; guardar()
  mostrarMensaje(`La reserva del día ${d} fue rechazada ✖`)
}

function cancelar(d){ 
  delete reservas[d]; guardar()
  mostrarMensaje(`Cancelaste tu reserva del día ${d}`)
}

function inhabilitar(d){
  reservas[d]={estado:"disabled"}
  guardar()
  mostrarMensaje(`El día ${d} fue inhabilitado 🚫`)
}

function habilitar(d){
  delete reservas[d]
  guardar()
  mostrarMensaje(`El día ${d} ahora está disponible 👍`)
}

render()
</script>

</body>
</html>
