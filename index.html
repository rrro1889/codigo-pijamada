<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas de la Tía</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f5; }
  h1, h2 { text-align: center; color: #333; }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 700px; margin: 20px auto; }
  .day, .weekday { padding: 10px; text-align: center; border-radius: 8px; min-height: 60px; display: flex; flex-direction: column; justify-content: center; }
  .weekday { font-weight: bold; background: #74b9ff; color: white; }
  .day { background: white; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .day.taken { cursor: not-allowed; opacity: 0.6; }
  .pending { background: #ffeaa7; }
  .approved { background: #55efc4; }
  .rejected { background: #ff7675; }
  .status { font-size: 0.8em; margin-top: 5px; }
  button { margin: 2px; padding: 5px 8px; border: none; border-radius: 5px; cursor: pointer; }
  .approve { background: #00b894; color: white; }
  .reject { background: #d63031; color: white; }
  #seleccionSobrino { text-align: center; margin-bottom: 20px; }
  select, input { padding: 5px 10px; font-size: 1em; }
  #panelTia { max-width: 700px; margin: 20px auto; padding: 10px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; }
  #accesoTia { text-align: center; margin-bottom: 20px; }
</style>
</head>
<body>

<h1>Reservas de la Tía</h1>

<div id="seleccionSobrino">
  <label for="sobrinos">Elegí tu nombre: </label>
  <select id="sobrinos">
    <option value="">-- Seleccionar --</option>
    <option value="Luz 💘">Luz 💘</option>
    <option value="Vicky 😜">Vicky 😜</option>
    <option value="Agus 😈">Agus 😈</option>
    <option value="Dante 🐴">Dante 🐴</option>
    <option value="Pili 🥳">Pili 🥳</option>
  </select>
</div>

<div id="calendarContainer">
  <div class="calendar" id="calendar"></div>
</div>

<div id="accesoTia">
  <input type="password" id="passwordTia" placeholder="Contraseña tía">
  <button id="mostrarPanel">Mostrar panel tía</button>
</div>

<div id="panelTia">
  <h2>Panel de la Tía: Reservas Pendientes</h2>
  <div id="pendingList"></div>
</div>

<script>
const calendar = document.getElementById('calendar');
const pendingList = document.getElementById('pendingList');
const sobrinosSelect = document.getElementById('sobrinos');
const panelTia = document.getElementById('panelTia');
const passwordTia = document.getElementById('passwordTia');
const mostrarPanelBtn = document.getElementById('mostrarPanel');

let reservas = {}; // {día: {nombre, estado}}
let sobrinoActual = '';
const CONTRASENA = 'tia123'; // podés cambiarla

// Selección del sobrino
sobrinosSelect.addEventListener('change', () => {
  sobrinoActual = sobrinosSelect.value;
  crearCalendario();
});

// Mostrar panel tía con contraseña
mostrarPanelBtn.addEventListener('click', () => {
  if(passwordTia.value === CONTRASENA){
    panelTia.style.display = 'block';
    passwordTia.value = '';
  } else {
    alert('Contraseña incorrecta');
  }
});

// Crear calendario del mes actual
function crearCalendario() {
  calendar.innerHTML = '';

  if(!sobrinoActual) return;

  const fecha = new Date();
  const año = fecha.getFullYear();
  const mes = fecha.getMonth();
  const primerDia = new Date(año, mes, 1).getDay();
  const diasMes = new Date(año, mes + 1, 0).getDate();

  const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  diasSemana.forEach(dia => {
    const wd = document.createElement('div');
    wd.classList.add('weekday');
    wd.textContent = dia;
    calendar.appendChild(wd);
  });

  for(let i=0; i<primerDia; i++){
    calendar.appendChild(document.createElement('div'));
  }

  for(let i=1; i<=diasMes; i++){
    const dayDiv = document.createElement('div');
    dayDiv.classList.add('day');
    dayDiv.textContent = i;

    if(reservas[i]){
      dayDiv.classList.add(reservas[i].estado);
      const statusDiv = document.createElement('div');
      statusDiv.classList.add('status');
      statusDiv.textContent = `${reservas[i].nombre} - ${reservas[i].estado === 'pending' ? 'Pendiente' :
                                  reservas[i].estado === 'approved' ? 'Aprobada' : 'Rechazada'}`;
      dayDiv.appendChild(statusDiv);

      if(reservas[i].estado !== 'rejected'){
        dayDiv.classList.add('taken');
      }
    }

    dayDiv.addEventListener('click', () => {
      if(!reservas[i] || reservas[i].estado === 'rejected'){
        reservas[i] = { nombre: sobrinoActual, estado: 'pending' };
        actualizarPendientes();
        crearCalendario();
      }
    });

    calendar.appendChild(dayDiv);
  }
}

// Actualizar lista de pendientes en panel tía
function actualizarPendientes(){
  pendingList.innerHTML = '';
  for(const dia in reservas){
    if(reservas[dia].estado === 'pending'){
      const div = document.createElement('div');
      div.textContent = Día ${dia} - ${reservas[dia].nombre};

      const approveBtn = document.createElement('button');
      approveBtn.textContent = 'Aprobar';
      approveBtn.classList.add('approve');
      approveBtn.onclick = () => {
        reservas[dia].estado = 'approved';
        crearCalendario();
        actualizarPendientes();
      };

      const rejectBtn = document.createElement('button');
      rejectBtn.textContent = 'Rechazar';
      rejectBtn.classList.add('reject');
      rejectBtn.onclick = () => {
        reservas[dia].estado = 'rejected';
        crearCalendario();
        actualizarPendientes();
      };

      div.appendChild(approveBtn);
      div.appendChild(rejectBtn);
      pendingList.appendChild(div);
    }
  }
}
</script>

</body>
</html>
