<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas de la Tía</title>

<style>
body { font-family: Arial; background:#f2f2f2; padding:20px }
h1 { text-align:center }
select, button { padding:8px; font-size:16px }
.calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; max-width:700px; margin:auto }
.day, .weekday { padding:10px; text-align:center; border-radius:6px }
.weekday { background:#74b9ff; color:white; font-weight:bold }
.day { background:white; cursor:pointer }
.day.taken { cursor:not-allowed }
.day.pending { background:#ffeaa7 }
.day.approved { background:#55efc4 }
#panelTia { display:none; background:white; padding:15px; margin-top:30px; border-radius:8px }
</style>
</head>

<body>

<h1>Reservas de la Tía</h1>

<select id="sobrino">
  <option value="">Elegí tu nombre</option>
  <option>Luz 💘</option>
  <option>Vicky 😜</option>
  <option>Agus 😈</option>
  <option>Dante 🐴</option>
  <option>Pili 🥳</option>
</select>

<div class="calendar" id="calendar"></div>

<br>
<button onclick="loginTia()">Panel secreto de la tía 😎</button>

<div id="panelTia">
  <h3>Reservas pendientes</h3>
  <div id="lista"></div>
</div>

<script>
const BIN_ID = "69442722d0ea881f40327849"
const API_KEY = "$2a$10$FR31Kbrr0ff2rjanMsgJ4exQAcBErSQ.UJvh69psys69XFYlurGmi"

let reservas = []
let sobrino = ""

document.getElementById("sobrino").onchange = e => {
  sobrino = e.target.value
}

function loginTia(){
  if(prompt("Contraseña de la tía") === "tia123"){
    document.getElementById("panelTia").style.display = "block"
    renderPanel()
  }
}

async function cargar(){
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`)
    const data = await res.json()
    reservas = data.record || []  // Si no hay datos, array vacío
    render()
    renderPanel()
  } catch (err) {
    console.error("Error cargando reservas:", err)
    reservas = []
    render()
  }
}

async function guardar(){
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "X-Master-Key":API_KEY
      },
      body:JSON.stringify(reservas)
    })
    await cargar()  // recarga después de guardar
  } catch(err){
    console.error("Error guardando reservas:", err)
  }
}

function render(){
  const cal = document.getElementById("calendar")
  cal.innerHTML = ""
  ;["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].forEach(d=>{
    cal.innerHTML += `<div class="weekday">${d}</div>`
  })
  for(let i=1;i<=31;i++){
    const r = reservas.find(x=>x.dia===i)
    let cls = "day"
    let contenido = i
    if(r){
      cls += ` taken ${r.estado}`
      contenido = i + "<br>" + r.nombre + (r.estado==="pending"?" ⏳":" ✔")
    }
    cal.innerHTML += `<div class="${cls}" onclick="reservar(${i})">${contenido}</div>`
  }
}

function reservar(dia){
  if(!sobrino) return alert("Elegí tu nombre")
  if(reservas.find(r=>r.dia===dia)) return alert("Este día ya está reservado")
  reservas.push({dia,nombre:sobrino,estado:"pending"})
  guardar()
}

function renderPanel(){
  const l = document.getElementById("lista")
  l.innerHTML = ""
  reservas.filter(r=>r.estado==="pending").forEach(r=>{
    l.innerHTML += `Día ${r.dia} - ${r.nombre} 
    <button onclick="aprobar(${r.dia})">✔</button>
    <br>`
  })
}

function aprobar(dia){
  const r = reservas.find(r=>r.dia===dia)
  if(r) r.estado="approved"
  guardar()
}

// cargar al inicio
cargar()
</script>

</body>
</html>
