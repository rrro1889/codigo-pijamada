<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas de la Tía</title>
<style>
body { font-family: Arial; background:#f0f8ff; padding:20px }
h1 { text-align:center; color:#2d3436; }
select, button { padding:8px; font-size:16px; border-radius:5px; border:1px solid #ccc; }
.calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; max-width:700px; margin:auto }
.day, .weekday { padding:10px; text-align:center; border-radius:6px; position: relative; transition: all 0.2s ease; font-size:18px; }
.weekday { background:linear-gradient(to bottom, #74b9ff, #0984e3); color:white; font-weight:bold }
.day { background:white; cursor:pointer; border:1px solid #bbb; }
.day:hover { background:#dfe6e9; }
.day.taken { background:#b2bec3; cursor:pointer; color:#2d3436; }
.day.pending { background:#ffeaa7; border:1px solid #fdcb6e; }
.day.approved { background:#55efc4; border:1px solid #00b894; font-size:24px; }
.day.cancelled { background:#fab1a0; border:1px solid #e17055; }
.day.disabled { background:#636e72; color:white; cursor:not-allowed; }
#panelTia { display:none; background:white; padding:15px; margin-top:30px; border-radius:8px; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
.panel-btn { margin-left:5px; padding:2px 6px; border-radius:4px; border:none; cursor:pointer; }
.panel-btn:hover { opacity:0.8; }
.panel-btn.aprobar { background:#00b894; color:white; }
.panel-btn.rechazar { background:#e17055; color:white; }
.panel-btn.disable { background:#636e72; color:white; }
.toast { position: fixed; top: 10px; right: 10px; background: #0984e3; color: white; padding: 10px 15px; border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); margin-top: 5px; opacity: 0.95; z-index: 9999; transition: all 0.5s ease; }
</style>
</head>
<body>

<h1>Reservas de la Tía</h1>

<select id="sobrino">
  <option value="">Elegí tu nombre</option>
  <option value="Luz 💋">Luz 💋</option>
  <option value="Vicky 😜">Vicky 😜</option>
  <option value="Agus 😈">Agus 😈</option>
  <option value="Dante 🐴">Dante 🐴</option>
  <option value="Pili 🥳">Pili 🥳</option>
</select>

<div class="calendar" id="calendar"></div>
<br>
<button onclick="loginTia()">Panel secreto de la tía 😎</button>

<div id="panelTia">
  <h3>Reservas pendientes</h3>
  <div id="lista"></div>
  <h3>Días disponibles</h3>
  <div id="listaDias"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { getDatabase, ref, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAm1-VI_kDEU0yuvVzG7FPAWMnvXzGpxYY",
    authDomain: "reservas-tia.firebaseapp.com",
    databaseURL: "https://reservas-tia-default-rtdb.firebaseio.com",
    projectId: "reservas-tia",
    storageBucket: "reservas-tia.firebasestorage.app",
    messagingSenderId: "1075374491628",
    appId: "1:1075374491628:web:39589fdde043aeff9ca2c9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let reservas = [];
  let sobrino = "";

  document.getElementById("sobrino").onchange = e => {
    sobrino = e.target.value;
  }

  function loginTia(){
    if(prompt("Contraseña de la tía") === "tia123"){
      document.getElementById("panelTia").style.display = "block";
      renderPanel();
    }
  }

  async function cargar(){
    const dbRef = ref(db);
    const snapshot = await get(child(dbRef, 'reservas'));
    reservas = snapshot.exists() ? Object.values(snapshot.val()) : [];
    render();
    renderPanel();
  }

  async function guardar(){
    const dbRef = ref(db);
    const updates = {};
    reservas.forEach((r,i)=> updates[i] = r);
    await set(child(dbRef, 'reservas'), updates);
    // La carga ya se hace con onValue
  }

  function render(){
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";
    ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].forEach(d=>{
      cal.innerHTML += `<div class="weekday">${d}</div>`;
    });
    for(let i=1;i<=31;i++){
      const r = reservas.find(x=>x.dia===i);
      let cls = "day";
      let content = i;
      if(r){
        if(r.estado==="approved"){
          cls += " taken approved";
          content = r.nombre.split(" ")[1] || "🙂";
        } else if(r.estado==="pending"){
          cls += " taken pending";
          content = `${i}<br>${r.nombre}`;
        } else if(r.estado==="disabled"){
          cls += " disabled";
        }
