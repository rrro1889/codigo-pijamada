<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reservas de la Tía</title>

<style>
body { font-family: Arial; background:#f2f2f2; padding:20px; text-align:center }
h1 { margin-bottom:10px }

select, button { padding:8px; font-size:16px; margin:5px }

.calendar {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  max-width:420px;
  margin:auto
}

.weekday {
  background:#74b9ff;
  color:white;
  padding:8px;
  border-radius:6px;
  font-weight:bold
}

.day {
  background:white;
  padding:12px;
  border-radius:6px;
  cursor:pointer;
  border:1px solid #ccc
}

.day.pending { background:#ffeaa7 }
.day.approved { background:#55efc4; font-size:22px }
.day.disabled { background:#ccc; cursor:not-allowed }

#panelTia {
  background:white;
  padding:15px;
  margin-top:25px;
  border-radius:8px
}
</style>
</head>

<body>

<h1>Reservas de la Tía</h1>

<select id="sobrino">
  <option value="">Elegí tu nombre</option>
  <option value="Luz">Luz 💋</option>
  <option value="Vicky">Vicky 😜</option>
  <option value="Agus">Agus 😈</option>
  <option value="Dante">Dante 🐴</option>
  <option value="Pili">Pili 🥳</option>
</select>

<div class="calendar" id="calendar"></div>

<br>
<button onclick="loginTia()">Panel secreto de la tía 😎</button>

<div id="panelTia" style="display:none">
  <h3>Panel de la tía</h3>
  <div id="lista"></div>
</div>

<!-- 🔹 Firebase clásico -->
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js"></script>

<script>
// Configuración Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAm1-VI_kDEU0yuvVzG7FPAWMnvXzGpxYY",
  authDomain: "reservas-tia.firebaseapp.com",
  databaseURL: "https://reservas-tia-default-rtdb.firebaseio.com",
  projectId: "reservas-tia",
  storageBucket: "reservas-tia.appspot.com",
  messagingSenderId: "1075374491628",
  appId: "1:1075374491628:web:39589fdde043aeff9ca2c9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const reservasRef = db.ref('reservas/');

const emojis = {
  Luz:"💋",
  Vicky:"😜",
  Agus:"😈",
  Dante:"🐴",
  Pili:"🥳"
};

let reservas = {};
let sobrino = "";

// Selección de sobrino
document.getElementById("sobrino").onchange = e => sobrino = e.target.value;

// Funciones globales para botones
function reservar(dia){
  if(!sobrino) return alert("Elegí tu nombre");
  const mias = Object.values(reservas).filter(r=>r.sobrino===sobrino && r.estado!=="cancelada");
  if(mias.length>=1) return alert("Ya hiciste una reserva");
  const r = reservas[dia];
  if(r?.estado==="disabled") return alert("Este día no está disponible");
  if(r) return;
  reservasRef.child(dia).set({sobrino, estado:"pending"});
}

function aprobar(d){ reservasRef.child(d).set({sobrino: reservas[d].sobrino, estado:"approved"}); }
function rechazar(d){ reservasRef.child(d).remove(); }
function inhabilitar(d){ reservasRef.child(d).set({estado:"disabled"}); }
function habilitar(d){ reservasRef.child(d).remove(); }
function cancelar(d){ reservasRef.child(d).remove(); }

// Panel secreto
function loginTia(){
  if(prompt("Contraseña de la tía") === "tia123"){
    document.getElementById("panelTia").style.display = "block";
    renderPanel();
  }
}

// Renderizar calendario
function render(){
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const hoy = new Date();
  const year = hoy.getFullYear();
  const month = hoy.getMonth();
  const primerDia = new Date(year,month,1).getDay();
  const totalDias = new Date(year,month+1,0).getDate();

  ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].forEach(d=>{
    cal.innerHTML += `<div class="weekday">${d}</div>`;
  });

  for(let i=0;i<primerDia;i++){
    cal.innerHTML += `<div></div>`;
  }

  for(let d=1; d<=totalDias; d++){
    const r = reservas[d];
    let cls="day";
    let txt=d;

    if(r){
      if(r.estado==="disabled"){ cls+=" disabled"; txt="🚫"; }
      if(r.estado==="pending"){ cls+=" pending"; txt=d+"<br>"+r.sobrino; }
      if(r.estado==="approved"){ cls+=" approved"; txt=emojis[r.sobrino]; }
    }

    cal.innerHTML += `<div class="${cls}" onclick="reservar(${d})">${txt}</div>`;
  }
}

// Renderizar panel de la tía
function renderPanel(){
  const l = document.getElementById("lista");
  l.innerHTML = "";
  Object.keys(reservas).forEach(d=>{
    const r=reservas[d];
    if(!r) return;
    if(r.estado==="pending"){
      l.innerHTML+=`Día ${d} - ${r.sobrino} <button onclick="aprobar(${d})">✔</button> <button onclick="rechazar(${d})">✖</button> <button onclick="inhabilitar(${d})">🚫</button><br>`;
    }
    if(r.estado==="disabled"){
      l.innerHTML+=`Día ${d} inhabilitado <button onclick="habilitar(${d})">Habilitar</button><br>`;
    }
    if(r.estado==="approved"){
      l.innerHTML+=`Día ${d} aprobado (${r.sobrino}) <button onclick="cancelar(${d})">Cancelar</button> <button onclick="inhabilitar(${d})">🚫</button><br>`;
    }
  });
}

// 🔹 Escuchar Firebase en tiempo real
reservasRef.on('value', snapshot=>{
  reservas = snapshot.val() || {};
  render();
  if(document.getElementById("panelTia").style.display==="block"){
    renderPanel();
  }
});
</script>

</body>
</html>
